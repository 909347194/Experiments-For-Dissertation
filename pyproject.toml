[project]
name = "experiments-for-dissertation"
version = "0.1.0"
description = "Independent algorithm-reproduction units for dissertation experiments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.3",
    "shapely>=2.0",
    "matplotlib>=3.8",
    "openai>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
