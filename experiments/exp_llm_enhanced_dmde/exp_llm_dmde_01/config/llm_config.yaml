# LLM 增强 DMDE 实验配置
provider: deepseek
model: deepseek-flash

# 注意：thinking 模式下服务端会忽略 temperature（仅非思考模式生效）
temperature: 0.7

# max_tokens 同时包含思维链（reasoning_content）与正文。
# deepseek-flash 默认开启 thinking，high 档单次思考可达 3000~15000 token；
# 之前设为 4096 会被思考吃光，导致 finish_reason=length、正文为空（LLM 决策失效）。
max_tokens: 8192
timeout: 60

# 思维链强度：none（关闭思考，最快且最省）/ low / high（服务端默认）/ max
reasoning_effort: low

# 输出被截断时 LLMClient 会自动加倍 max_tokens 重试，上限由该值约束
max_tokens_cap: 16384

# --- 模块级 Prompt 可配置 ---
# 在 solver config 的 modules 字段中，可为 search_controller 指定自定义 prompt：
#
# modules:
#   search_controller:
#     enabled: true
#     interval: 50
#     # 方式 1: 直接在配置中写 prompt（适合短 prompt）
#     system_prompt: |
#       You are an expert in DE optimization...
#       Your custom prompt here...
#
#     # 方式 2: 从文件加载 prompt（适合长 prompt 或多场景复用）
#     # system_prompt_path: config/prompts/search_controller_balanced.txt
#
# 不指定 system_prompt 或 system_prompt_path 时，使用代码内置的默认 prompt。
# 不同场景（balanced/overloaded/srp）可在不同实验配置中定义不同的 prompt。
