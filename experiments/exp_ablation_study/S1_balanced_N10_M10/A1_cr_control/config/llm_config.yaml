# A1: 仅启用 CR Control — SiliconFlow
provider: siliconflow
model: Qwen/Qwen3.8-27B
# 主模型（27B）重试耗尽后切换到的快速回退模型（14B，同一 provider）
fallback_model: Qwen/Qwen3-14B
temperature: 0.7
max_tokens: 8192
timeout: 60
enable_thinking: false

# 截断重试时 max_tokens 的上限
max_tokens_cap: 16384

modules:
    search_controller:
        enabled: true
        # 保留 interval 作为向后兼容字段；mode=event 时由事件触发器接管
        interval: 50

        # ---- 事件触发（替代固定 interval）----
        # 在搜索状态发生值得注意的变化时才咨询 LLM，而非每 50 代固定调用
        trigger:
            mode: "event" # event = 事件驱动；缺省为固定 interval
            first_call: 50 # 首次决策最早代数（积累初始历史）
            min_interval: 20 # 两次决策最小间隔（防抖）
            max_interval: 100 # 最大间隔（fallback 定时器，保底定期咨询）
            df_threshold: 0.05 # Δf 事件阈值(%)
            # ΔD 事件阈值：实测 stage |ΔD| 中位数 0.034，旧值 0.02 低于中位
            # 导致 91.9% 的 stage 都触发（近乎常开，退化为定时咨询）。
            # 提到 0.05（约 1.5× 中位数）后触发率降至 ~21%，
            # 使多样性变化成为真正的信号而非噪声。
            dd_threshold: 0.05
            stag_tiers: [5, 10, 20, 40, 80, 160] # 停滞跨档事件边界

        # ---- 影子对照（可归因锚点）----
        # 固定 CR=0.5 的影子种群从每个 stage 起点与主种群同源演化，
        # 提供"如果不调整会怎样"的基线，使 LLM 能区分自身参数效果
        shadow:
            enabled: true
            cr: 0.5

        # ---- 无证据冻结守卫 ----
        # 本 stage CR 通道被判定为无信息（无改进且与影子对照无差异）时，
        # 冻结 CR，LLM 本轮只能决定 F 和 GMR，避免操作因果效应为零的通道
        freeze:
            enabled: true
            df_noise: 0.05 # |df| 噪声阈值(%)
            shadow_contrast: 0.05 # |df - df_shadow| 无差异阈值(%)
            # GMR / F 失败冻结(复用 CR 的 freeze 模式,但判据是"连续无效动作")
            # 连续 N 次主动干预后 stage 仍无实质改善(df < df_noise)即冻结该通道,
            # 直到搜索再次出现实质改善自动解锁。
            gmr_freeze_after: 3 # GMR 连续无效 3 次 → 强制 auto
            f_freeze_after: 3 # F 连续无效 3 次 → 强制 hold
