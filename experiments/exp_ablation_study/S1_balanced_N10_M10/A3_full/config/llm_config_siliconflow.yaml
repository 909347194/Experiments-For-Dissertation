# SiliconFlow Qwen3 配置示例
# 环境变量: export SILICONFLOW_API_KEY=sk-xxx

provider: siliconflow
model: Qwen/Qwen3-8B
temperature: 0.7
max_tokens: 8192
timeout: 60

# Qwen3 思考模式（SiliconFlow 用 enable_thinking，不用 reasoning_effort）
enable_thinking: false        # true=开启思考，false=关闭
# thinking_budget: 4096       # 思考 token 上限（128-32768）

max_tokens_cap: 16384