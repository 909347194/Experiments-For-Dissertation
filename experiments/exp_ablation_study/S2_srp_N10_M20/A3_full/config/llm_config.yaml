# A3: Full LLM-DMDE（PopInit + CR Control）— SiliconFlow Qwen3-14B
#
# Qwen3-14B 在 SiliconFlow enable_thinking 白名单内（与 Qwen3-8B/32B 等并列），
# 顶层 enable_thinking 与嵌套 chat_template_kwargs 两种形式均能关闭思考。

provider: siliconflow
model: Qwen/Qwen3-14B
temperature: 0.7
max_tokens: 32768
timeout: 180

# 关闭思考（使用嵌套 chat_template_kwargs 形式，与顶层字段等价）
extra_body:
    chat_template_kwargs:
        enable_thinking: false
        thinking_budget: 512

# 截断重试时 max_tokens 的上限
max_tokens_cap: 65536

modules:
    population_init:
        enabled: true
        llm_init_ratio: 0.1
        preference_top_k: 3
    search_controller:
        enabled: true
        interval: 50
