# A3: Full LLM-DMDE（PopInit + CR Control）— SiliconFlow Qwen3.5-9B
provider: siliconflow
model: Qwen/Qwen3.5-9B
temperature: 0.7
max_tokens: 4096
timeout: 120
enable_thinking: false
max_tokens_cap: 8192

modules:
  population_init:
    enabled: true
    llm_init_ratio: 0.2
    preference_top_k: 3
  search_controller:
    enabled: true
    interval: 50
