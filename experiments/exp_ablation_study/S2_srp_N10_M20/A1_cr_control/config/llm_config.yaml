# A1: 仅启用 CR Control — SiliconFlow Qwen3-14B
#
# Qwen3-14B 在 SiliconFlow enable_thinking 白名单内（与 Qwen3-8B/32B 等并列），
# 顶层 enable_thinking 与嵌套 chat_template_kwargs 两种形式均能关闭思考。

provider: siliconflow
model: Qwen/Qwen3-14B
temperature: 0.7
max_tokens: 32768
timeout: 180

# 关闭思考（使用嵌套 chat_template_kwargs 形式，与顶层字段等价）
extra_body:
    chat_template_kwargs:
        enable_thinking: false
        thinking_budget: 512

# 截断重试时 max_tokens 的上限
max_tokens_cap: 65536

modules:
    search_controller:
        enabled: true
        interval: 50          # 旧版固定间隔（event 模式下不生效，保留兼容）
        # ---- v2 闭环控制（可观测 / 可归因 / 可触发 / 能控性） ----
        trigger:
            mode: event       # 事件触发替代固定 interval
            first_call: 50    # 首次决策最早代数（保证有初始历史）
            min_interval: 20  # 两次决策最小间隔（防抖）
            max_interval: 100 # 最大间隔（fallback 定时器）
            df_threshold: 0.05   # Δf 事件阈值（%）
            dd_threshold: 0.02   # ΔD 事件阈值（噪声参考量级）
            stag_tiers: [5, 10, 20, 40, 80, 160]  # 停滞跨档事件边界
        shadow:
            enabled: true     # 影子对照种群（固定 CR=0.5 归因基线）
            cr: 0.5
        actions:
            restart_choices: [0.0, 0.1, 0.2, 0.3]  # 重启比例候选（收敛后的有效动作）
